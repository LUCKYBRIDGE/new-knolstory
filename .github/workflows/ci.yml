name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck
      - run: pnpm lint
      # Full asset corpus is private and unverified for public redistribution.
      # This public job validates source/contracts; local full media/Chrome gates are documented.
      - run: pnpm exec vitest run --coverage --maxWorkers=2 --exclude packages/asset-registry/tests/catalog.test.ts
      - run: pnpm build
