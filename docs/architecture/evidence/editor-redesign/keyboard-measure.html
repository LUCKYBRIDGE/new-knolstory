<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼성 키보드 실측</title><style>body{font:16px sans-serif;margin:16px;background:#f7f3e9;color:#183331}button,textarea,input{font:inherit;border:1px solid #d8d0c2;border-radius:10px;padding:12px;margin:6px 0}textarea{width:100%;box-sizing:border-box;min-height:100px}button{min-height:44px}pre{white-space:pre-wrap;font-size:12px;background:#fffdf8;padding:12px}p{line-height:1.6}</style><h1>삼성 키보드 실측 기록</h1><p>실제 휴대폰/태블릿 브라우저에서 사용합니다. 키보드를 닫고 기준값을 기록한 뒤 입력칸을 눌러 한글을 입력하세요. 아래 기록에는 입력한 글을 넣지 않습니다.</p><input id="device" placeholder="Galaxy 기기·One UI·삼성 키보드 버전·모드·방향"><button id="baseline">키보드 닫힌 기준 기록</button><textarea id="sample" placeholder="이곳을 눌러 실제 키보드를 여세요"></textarea><button id="save">측정 JSON 내보내기</button><pre id="output"></pre><script>
let records=[],baseline=null;const vv=window.visualViewport;function sample(reason){const keyboard=navigator.virtualKeyboard?.boundingRect;const r={reason,time:Date.now(),screen:{width:screen.width,height:screen.height},inner:{width:innerWidth,height:innerHeight},client:{width:document.documentElement.clientWidth,height:document.documentElement.clientHeight},visual:vv?{width:vv.width,height:vv.height,offsetTop:vv.offsetTop,offsetLeft:vv.offsetLeft,scale:vv.scale}:null,dpr:devicePixelRatio,keyboard:keyboard?{x:keyboard.x,y:keyboard.y,width:keyboard.width,height:keyboard.height}:null,focused:document.activeElement===document.getElementById('sample')};if(baseline&&r.visual&&baseline.visual&&r.visual.scale===baseline.visual.scale)r.visibleHeightLoss=baseline.visual.height-r.visual.height;records.push(r);document.getElementById('output').textContent=JSON.stringify(r,null,2);return r}document.getElementById('baseline').onclick=()=>baseline=sample('keyboard-hidden-baseline');for(const event of ['resize','scroll'])vv?.addEventListener(event,()=>sample('visualViewport-'+event));window.addEventListener('resize',()=>sample('window-resize'));document.getElementById('sample').onfocus=()=>sample('input-focus');document.getElementById('sample').onblur=()=>sample('input-blur');navigator.virtualKeyboard?.addEventListener('geometrychange',()=>sample('keyboard-geometry'));document.getElementById('save').onclick=()=>{const data={device:document.getElementById('device').value,note:'visibleHeightLoss can include browser chrome; floating keyboard needs geometry; no input text recorded',baseline,records};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='keyboard-measurement.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};sample('page-ready');
</script></html>
