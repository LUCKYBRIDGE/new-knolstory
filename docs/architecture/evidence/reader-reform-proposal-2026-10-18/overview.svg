<text x="32" y="552" class="small">배경과 인물은 글 영역 뒤까지 원래 크기·위치로 이어짐. 하단 패널이 그 위를 가림.</text><text x="32" y="575" class="small">그림의 인물은 구도 원리를 위한 기호이며 최종 세로 화자 표시 정책을 확정한 그림이 아님.</text><text x="32" y="598" class="small">짧은 글에서도 패널 높이 유지 · 넘치는 글에서만 계속/이전 · 바깥 여백에 도구를 놓지 않음</text><text x="32" y="625" class="small">개발 전 종합 확정 대기 · 기존 원고/자유 배치/선택 경로/저장 기록 보존</text></svg>