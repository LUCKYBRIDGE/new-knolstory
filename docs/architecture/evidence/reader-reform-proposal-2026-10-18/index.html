<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뉴놀스토리 읽기 개편 구조안</title><style>body{margin:24px;background:#eeeae1;color:#183331;font:16px/1.7 system-ui}main{max-width:1200px;margin:auto}img{width:100%;height:auto}a{color:#285c48}strong{color:#674722}</style><main><h1>뉴놀스토리 읽기 화면 개편안</h1><p><strong>검토용 구조도입니다. 실제 재생 화면이나 동작하는 메뉴가 아닙니다.</strong> 제품 개편 개발은 종합안 확정 후 진행합니다.</p><img src="overview.svg" alt="가로16대9와 세로9대16의 전체 장면 위에 고정 높이 하단 글 영역을 겹친 구조. 가로4줄 세로6줄, 상단 장 정보와 햄버거, 작은 투명 도구."><p>배경·인물은 전체 무대 기준. 글 영역 때문에 축소하거나 위로 밀지 않습니다. 정확한 패널 높이·글자 크기는 실제 Ren’Py 측정에서 확인합니다.</p><p><a href="../../reading-interface-design.md">상세 개선안 문서</a></p></main></html>
