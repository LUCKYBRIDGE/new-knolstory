<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현재 편집 작업 화면</title><style>body{font:16px/1.6 system-ui;background:#f7f3e9;color:#183331;max-width:1280px;margin:auto;padding:24px}figure{margin:32px 0;padding:16px;border:1px solid #d8d0c2;background:#fffdf8;border-radius:12px}img{display:block;max-width:100%;height:auto;max-height:900px;object-fit:contain;object-position:left top}figcaption{font-weight:700;margin:12px 0}a{color:#2f7d68}</style><h1>현재 편집 작업 화면 · 2026-10-19</h1><p>테스트용 세 컷 원고로 실행한 실제 Web UI 캡처입니다. 자료 썸네일은 실제 Ren’Py 합성 장면 캡처와 구분합니다. 화면의 영어/시험용 원고는 검증 fixture이며 제공 작품 원고를 바꾸지 않았습니다.</p><p>구현: 기본편집·글·배경·인물·음향·연출의 여섯 작업 화면, 읽기 전용 함께 보기, 기능별 명시 개방. 음향/연출 범위와 인물 변경의 동작 근거는 <a href="checkpoint.json">checkpoint</a>와 E2E 로그에서 확인합니다. 현재 모든 여섯 화면의 시각 캡처를 포함한 전체 기기 감사는 아닙니다.</p><figure><figcaption>기본편집 · 넓은 화면</figcaption><a href="screens/basic-neighbors-1440.png"><img alt="기본편집 · 넓은 화면" src="screens/basic-neighbors-1440.png"></a></figure><figure><figcaption>기본편집 · 좁은 화면</figcaption><a href="screens/basic-neighbors-390.png"><img alt="기본편집 · 좁은 화면" src="screens/basic-neighbors-390.png"></a></figure><figure><figcaption>여러 컷 글 편집</figcaption><a href="screens/multi-cut-text.png"><img alt="여러 컷 글 편집" src="screens/multi-cut-text.png"></a></figure><figure><figcaption>모바일 글 편집</figcaption><a href="screens/multi-cut-ime-mobile.png"><img alt="모바일 글 편집" src="screens/multi-cut-ime-mobile.png"></a></figure></html>
